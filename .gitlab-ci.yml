stages:
  - test

playwright-tests:
  image: mcr.microsoft.com/playwright:v1.45.0-jammy
  stage: test
  script:
    - npm ci
    - npx playwright install --with-deps
    - npx playwright test --reporter=html
  artifacts:
    paths:
      - playwright-report
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
